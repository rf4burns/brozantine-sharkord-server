name: Manual Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: "none"

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  build-and-publish:
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Build project artifacts
        uses: ./.github/actions/build-kurier
        with:
          bump: ${{ inputs.bump }}

      - name: Get new version
        id: get_version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Build release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/kurier:v${{ steps.get_version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          docker_image = os.environ["DOCKER_IMAGE"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text,
              re.M | re.S,
          )
          notes = match.group(1).strip() if match else "See CHANGELOG.md for this version."
          pathlib.Path("release-notes.md").write_text(
              "\n".join(
                  [
                      "## Changes",
                      "",
                      notes,
                      "",
                      "## Docker Image",
                      "```bash",
                      f"docker pull {docker_image}",
                      "```",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY

      - name: Identify user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and publish Docker image
        uses: ./.github/actions/docker-build-publish
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kurier:latest
            ${{ secrets.DOCKER_USERNAME }}/kurier:v${{ steps.get_version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Kurier
            org.opencontainers.image.description=Kurier Server
            org.opencontainers.image.version=${{ steps.get_version.outputs.version }}
            org.opencontainers.image.source=https://github.com/rf4burns/brozantine-sharkord-server

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          draft: false
          files: |
            apps/server/build/out/kurier-linux-x64
            apps/server/build/out/kurier-linux-arm64
            apps/server/build/out/kurier-windows-x64.exe
            apps/server/build/out/kurier-macos-x64
            apps/server/build/out/kurier-macos-arm64
            apps/server/build/out/release.json
          body_path: release-notes.md

      - name: Remove generated release notes
        if: always()
        run: rm -f release-notes.md

      - name: Commit version bump
        if: ${{ inputs.bump != 'none' }}
        run: |
          git add .
          git commit -m "chore: bump version to ${{ steps.get_version.outputs.version }}"

      - name: Create Git tag
        run: |
          if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.get_version.outputs.version }} already exists; skipping create"
          else
            git tag -a "v${{ steps.get_version.outputs.version }}" -m "Release v${{ steps.get_version.outputs.version }}"
          fi

      - name: Push commit and tag
        run: git push origin "HEAD:${{ github.ref_name }}" --follow-tags
